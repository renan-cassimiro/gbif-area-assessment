# Filtragem independente de registros GBIF já em cache (scripts/filter.R).
# Não consulta o GBIF, não exige credenciais e nunca altera o cache.
# Caminhos relativos são resolvidos a partir da raiz do projeto.
#
# ATENÇÃO: os caminhos abaixo são PLACEHOLDERS. Substitua pela pasta real da entrada de cache
# (a chave aparece no log/relatório da execução de run.R) e pelo seu raster.

project:
  name: "gbif_area_assessment"

input:
  # Use UMA das duas formas:
  from_run: "results/bacia_rio_tefe_run_20261026_165300"   # run de assessment concluída: as entradas de cache vêm dela (retrieval.csv + config_effective.yaml)
  # cache_entries:                  # ou seleção explícita (a raiz do cache nunca é varrida)
  #   - "data/cache/gbif/<cache_key>"   # uma entrada por área; area_id vem do meta.yaml e não pode repetir

filters:
  spatial:
    raster:
      enabled: true
      path: "data/input/LBA_Amazon_wetland_dual-season_veg_flood_3arcsec_reclassified_cog/LBA_Amazon_wetland_dual-season_veg_flood_3arcsec_reclassified_cog.tif"
      accepted_values: [1]
analysis:
  top_n: 10
  density_cell_km: 5
  metric_crs: "auto"
  max_map_points: 50000
  low_coverage_pct: 20

output:
  directory: "results/filtering"    # cada execução cria results/filtering/[<run_label>_]run_YYYYMMDD_HHMMSS/
  run_label: null                   # null = herda o label da run indicada em from_run (se houver)
  spatial_format: "geoparquet"      # geoparquet | gpkg
  darwin_core:                      # produto final: registros retidos em Darwin Core Archive, um zip por área
    enabled: true
    creator: "Renan Cassimiro Brito"           # obrigatório se enabled: true

logging:
  level: "INFO"
