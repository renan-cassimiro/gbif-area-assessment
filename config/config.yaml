# gbif-area-assessment — configuração de exemplo
# Caminhos relativos são resolvidos a partir da raiz do projeto.

project:
  name: "gbif_area_assessment"

input:
  area:
    mode: "draw"                    # "gpkg" ou "draw" (mutuamente exclusivos)
    path: null   # obrigatório se mode = "gpkg"; deve ser null se mode = "draw"
    layer: null                     # obrigatório se o GPKG tiver mais de uma camada
    id_column: null                 # coluna identificadora; null = detecção automática ou area_01, area_02, ...
    fix_invalid: false              # true = corrige geometrias inválidas com st_make_valid() (registrado no log)

gbif:
  # Somente filtros declarados aqui são aplicados (nenhum filtro científico implícito).
  # Só o polígono por padrão; exemplos (descomente se necessário):
  filters:
    # basisOfRecord: [PRESERVED_SPECIMEN]       # dados de curadoria
    # hasCoordinate: true
    # year: {min: 2000, max: 2026}

  query:
    method: "download"              # "download" (occ_download, assíncrono, sem teto) ou "search" (paginado, teto de 100 mil)
    # --- method: download (exige GBIF_USER, GBIF_PWD, GBIF_EMAIL no ~/.Renviron) ---
    download_wait_minutes: 720      # tempo máximo de espera pelo GBIF; ao estourar, rodar de novo retoma o mesmo pedido
    download_poll_seconds: 30
    keep_download_zip: false        # manter o zip após importar (ocupa disco)
    # --- method: search ---
    max_records: 100000
    page_size: 300
    max_retries: 3
    retry_wait_seconds: 5

  cache:
    enabled: true
    directory: "data/cache/gbif"
    use_cached: true
    refresh: false

analysis:                           # parâmetros descritivos (opcionais)
  density_cell_km: 5                # lado da célula da grade de densidade
  top_n: 10                         # nº de táxons/grupos mais frequentes por área
  low_coverage_pct: 20              # abaixo disso a cobertura espacial é sinalizada no relatório
  max_map_points: 50000             # mapa de pontos usa amostra sistemática acima disso
  metric_crs: "auto"                # "auto" = Lambert azimutal de áreas iguais centrado nas áreas; ou um código (ex.: "EPSG:5880")

output:
  write_records_layer: true         # false = não grava a camada gbif_records no GPKG (útil com milhões de registros)
  directory: "results"              # cada execução cria results/run_YYYYMMDD_HHMMSS/

logging:
  level: "INFO"                     # DEBUG, INFO, WARN, ERROR
